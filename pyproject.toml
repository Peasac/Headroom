[project]
name = "headroom"
version = "0.1.0"
description = "Does a laptop agent that adapts to live device conditions beat the best fixed configuration?"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "nvidia-ml-py>=13.615.71",
    "psutil>=7.2.2",
    "pydantic>=2.9",
    "typer>=0.12",
]

[project.scripts]
headroom = "headroom.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: needs a running Ollama server with the pinned models (run with: uv run pytest -m live)",
]
